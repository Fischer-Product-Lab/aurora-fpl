[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-orchestration-lab"
version = "0.1.0"
description = "A deterministic teaching simulator for agent orchestration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=2.0,<3"]

[project.scripts]
aurora-lab = "aurora_lab.cli:main"

[tool.setuptools]
packages = ["aurora_lab"]
